  <title>Finding Your Available Offer</title>

  <meta name="robots" content="noindex, nofollow" />
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #102018;
      background:
        radial-gradient(circle at 12% 12%, rgba(46, 204, 113, .24), transparent 38%),
        radial-gradient(circle at 88% 88%, rgba(37, 99, 235, .16), transparent 42%),
        #f6fbf8;
    }
    .router-card {
      width: min(100%, 430px);
      padding: 30px 26px;
      text-align: center;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(16, 32, 24, .10);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(16, 32, 24, .16);
    }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border: 5px solid #dff7e9;
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 13px;
      padding: 7px 11px;
      color: #166534;
      background: #eafaf0;
      border: 1px solid #c9f1d8;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(27px, 7vw, 36px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }
    p {
      margin: 0;
      color: #526158;
      font-size: 15px;
      line-height: 1.58;
    }
  </style>
</head>

      const SHEIN_COUNTRIES = new Set(["US", "CA", "GB", "AU"]);

      function normalizeCountry(value) {
        const code = String(value || "").trim().toUpperCase();
        return code === "UK" ? "GB" : code;
      }

      function decodePage(encoded) {
        const bytes = Uint8Array.from(atob(encoded), char => char.charCodeAt(0));
        return new TextDecoder("utf-8").decode(bytes);
      }

      function renderPage(encoded, countryCode) {
        const normalizedCode = normalizeCountry(countryCode) || "ROW";
        const pageHtml = decodePage(encoded).replaceAll("__WALKMINT_COUNTRY__", normalizedCode);
        document.open();
        document.write(pageHtml);
        document.close();
      }

      async function fetchJson(url, timeoutMs = 4500) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const response = await fetch(url, {
            signal: controller.signal,
            headers: { "Accept": "application/json" }
          });
          if (!response.ok) throw new Error("Geo lookup failed");
          return await response.json();
        } finally {
          clearTimeout(timer);
        }
      }

      async function detectCountry() {
        try {
          const primary = await fetchJson("https://ipapi.co/json/");
          const code = normalizeCountry(primary && primary.country_code);
          if (code) return code;
        } catch (_) {}

        try {
          const backup = await fetchJson("https://ipwho.is/");
          const code = normalizeCountry(backup && backup.country_code);
          if (backup && backup.success !== false && code) return code;
        } catch (_) {}

        return "";
      }

      async function startRouter() {
        const detectedCountry = await detectCountry();

        if (SHEIN_COUNTRIES.has(detectedCountry)) {
          renderPage(SHEIN_PAGE, detectedCountry);
          return;
        }

        renderPage(WALKMINT_PAGE, detectedCountry || "ROW");
      }

      startRouter();
    })();
